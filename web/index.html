<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA — Music</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">✦</div>
      <span>NOVA</span>
    </div>
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Поиск треков, артистов..." autocomplete="off" />
      <button id="search-btn">Найти</button>
    </div>
    <div class="user-area">
      <a id="login-btn" href="/api/auth/discord" class="login-btn">Войти через Discord</a>
      <div id="user-info" class="user-info hidden">
        <img id="user-avatar" alt="" />
        <span id="user-name"></span>
      </div>
    </div>
  </header>

  <main class="content">
    <section id="welcome" class="welcome">
      <h1>Добро пожаловать в NOVA</h1>
      <p>Найди свою любимую музыку. Введи название трека или исполнителя в строку поиска.</p>
    </section>

    <section id="results" class="results hidden">
      <h2>Результаты поиска</h2>
      <div id="results-list" class="results-list"></div>
    </section>

    <section id="now-playing" class="now-playing hidden">
      <h2>Сейчас играет</h2>
      <div class="np-card">
        <img id="np-cover" alt="" />
        <div class="np-info">
          <div id="np-title" class="np-title">—</div>
          <div id="np-artist" class="np-artist">—</div>
        </div>
      </div>
      <audio id="audio-player" controls></audio>
      <button id="lyrics-btn" class="lyrics-btn">Показать текст</button>
      <pre id="lyrics-box" class="lyrics-box hidden"></pre>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
